# --- File handling defaults (shared across routes) ---
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D
read.lock=readLock=changed
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D
# Alternative: use done.file when upstream produces a .done marker (mutually exclusive with read.lock)
# done.file=doneFileName=%24%7Bfile:name%7D.done

# --- import-ppv-shipping-cost route configuration ---
# SFTP source: remote folder where shipping cost CSV files are dropped daily
pfx\:import-ppv-shipping-cost.sftp.connection=shipping-cost-sftp
pfx\:import-ppv-shipping-cost.sftp.path=/inbound/shipping-cost
