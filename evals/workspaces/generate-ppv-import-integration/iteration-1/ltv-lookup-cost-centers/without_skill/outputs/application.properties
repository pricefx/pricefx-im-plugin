# ---- Shared file-handling settings (typically defined once per project) ----
# Move processed files to a timestamped archive folder
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Wait until the file size stabilizes before reading (no .done marker file available)
read.lock=readLock=changed

# Move failed files to error folder (optional)
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D

# ---- Route-specific settings: import-department-cost-centers ----
# CSV expected columns: departmentCode,costCenter (with header row)
# Drop the CSV file into: {integration.sftp.root}/import/ppv/department-cost-centers
pfx\:import-department-cost-centers.pricingParameterName=DepartmentCostCenters
