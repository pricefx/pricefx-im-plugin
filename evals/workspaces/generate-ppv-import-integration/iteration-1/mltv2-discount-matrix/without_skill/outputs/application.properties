# Base data directory (provisioned IM convention)
data.directory={{integration.sftp.root}}

# Shared file-consumer property snippets (define once per project) ---
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D
read.lock=readLock=changed
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D

# --- Route: import-discount-matrix --------------------------------------
# MLTV2 Pricing Parameter table name in Pricefx that holds the discount matrix.
# The PPV table must exist with: key1 (customer category), key2 (product family),
# key3 (quantity tier), attribute1 (discount %).
pfx\:import-discount-matrix.pricingParameterName=DiscountMatrix
