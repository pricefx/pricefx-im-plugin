# ----------------------------------------------------------------------------
# Common file-consumer property fragments (defined once per project)
# ----------------------------------------------------------------------------
# Move processed files to timestamped archive
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Wait until file size stabilizes (no .done marker is available from ECB feed)
read.lock=readLock=changed

# Move failed files to .error/ for triage
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D

# ----------------------------------------------------------------------------
# import-exchange-rates route configuration
# ----------------------------------------------------------------------------
# Source folder under the IM-mounted SFTP root where ECB drops the CSV daily
pfx\:import-exchange-rates.sourceFolder=${integration.sftp.root}/import/exchange-rates

# Cron — daily at 06:00 Europe/Frankfurt (ECB publishes rates at ~16:00 CET the previous day)
pfx\:import-exchange-rates.cron=0+0+6+*+*+?

# Target PPV (LTV) table
pfx\:import-exchange-rates.pricingParameterName=ExchangeRates
