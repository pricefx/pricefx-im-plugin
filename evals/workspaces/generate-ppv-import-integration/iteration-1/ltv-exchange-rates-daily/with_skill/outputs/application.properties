# --- File component helper properties (shared) ---
# Move processed files into a dated archive folder under the source directory.
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Wait until the file size stops changing before processing (used when no .done marker is produced).
read.lock=readLock=changed

# Alternative to read.lock when the external system writes a .done marker file.
# done.file=doneFileName=%24%7Bfile:name%7D.done

# Optional: move files that fail processing to an .error subfolder.
# error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D
