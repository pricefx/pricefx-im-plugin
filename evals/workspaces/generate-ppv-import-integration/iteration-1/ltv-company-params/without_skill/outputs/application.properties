# ---------------------------------------------------------------------------
# Shared file consumer settings
# ---------------------------------------------------------------------------
# Move processed files to a timestamped archive folder
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Wait until file size stabilizes before reading (no .done marker available)
read.lock=readLock=changed

# Move failed files to an error folder
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D

# ---------------------------------------------------------------------------
# Route: import-company-params
# Loads LTV (single-key lookup) Pricing Parameter values from CSV
# ---------------------------------------------------------------------------
# Inbound directory (mounted into the IM pod's local filesystem)
pfx\:import-company-params.inbound=/im/inbound

# Name of the LTV Pricing Parameter table in Pricefx that receives the rows
pfx\:import-company-params.pricingParameterName=CompanyParameters
