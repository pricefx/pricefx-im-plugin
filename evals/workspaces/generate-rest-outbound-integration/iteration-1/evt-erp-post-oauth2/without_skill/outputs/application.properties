# Route: post-approved-pl-to-erp
# Listens for Pricefx ITEM_APPROVED_PL events and POSTs the approved item to the ERP.

# Polling delay (ms) for the Pricefx event consumer
pfx\:post-approved-pl-to-erp.eventDelay=60000

# ERP REST endpoint base + path (the connection holds the base URL; route uri holds the path)
pfx\:post-approved-pl-to-erp.erpPath=/api/v2/contracts
pfx\:post-approved-pl-to-erp.connectionTimeoutMs=60000
