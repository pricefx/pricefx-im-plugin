# =========================================================================
# Outbound REST integration: export-approved-contracts-to-erp
# Triggered by Pricefx event ITEM_APPROVED_PL.
# POSTs approved contracts to ERP using OAuth 2.0 client-credentials.
# =========================================================================

# --- Target ERP endpoint ---
ext.api.url=https://erp.internal/api/v2/contracts

# --- Auth: OAuth 2.0 client credentials ---
ext.api.auth.url=https://erp.internal/oauth2/token
ext.api.auth.grantType=client_credentials
ext.api.auth.clientId=my-client-id
ext.api.auth.clientSecret={ENC}encryptedValue==
ext.api.auth.scope=erp.contracts.write

# --- Throttling ---
ext.api.maxConcurrentConnections=10

# --- Dry-run toggle (set 'true' to suppress HTTP calls during testing) ---
ext.api.call_is_DISABLED=false

# --- Retry (used if onException with redeliveryPolicy is added later) ---
ext.api.retry.maxRedeliveries=3
ext.api.retry.delayMs=5000
