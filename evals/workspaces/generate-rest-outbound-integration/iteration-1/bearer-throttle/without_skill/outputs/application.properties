# Integration identity
integration.name=partner-webhook

# Webhook receiver
# The base URL is set in webhook.connection.json (NoopConnection.url).
# The Bearer token is injected as an Authorization header in the route.
# In production, store the token in an encrypted property (see Provisioned IM FAQ on encrypted properties).
webhook.bearer.token=REPLACE_ME_WITH_BEARER_TOKEN

# Route-specific overrides (optional)
pfx\:export-webhook.batchSize=5000
