# =============================================================================
# export-webhook-daily — outbound webhook integration
# =============================================================================

# --- Target endpoint ---
ext.api.url=https://partner.example.com/webhook

# --- Auth: static Bearer token ---
# Replace with the encrypted token in the deployed environment.
ext.api.auth.bearerToken={ENC}encryptedValue==

# --- Throttling (requests per second sent to the webhook) ---
ext.api.throttle.requestsPerSecond=5

# --- Dry-run toggle (set 'true' to suppress HTTP calls during testing) ---
ext.api.call_is_DISABLED=false

# --- Scheduling: daily at 02:00 ---
# Quartz cron: seconds minutes hours day-of-month month day-of-week
# Spaces are replaced by '+' in Camel URIs.
ext.api.schedule.cron=0+0+2+*+*+?
ext.api.schedule.timezone=UTC

# --- Source data: replace with the dataset you want to push ---
# These are placeholders — point them at the Pricefx DM/DS, filter, and mapper
# that produce the rows the webhook should receive.
ext.api.source.dsUniqueName=DMDS.WebhookExport
ext.api.source.filter=export-webhook-daily.filter
