# =============================================================================
# Route: export-quote-submitted-to-sap
# Trigger: pfx-event QUOTE_SUBMITTED
# Target: SAP API Management (OData) via JWT + CSRF + cookies
# =============================================================================

# Event polling cadence (ms). The pfx-event:fetch URI already sets delay=60000;
# property is here for reference / future override.
pfx\:export-quote-submitted-to-sap.eventPollDelay=60000

# SAP OData service / entity set names — adjust per SAP landscape.
sap.odata.service=ZQUOTE_INBOUND_SRV
sap.odata.entitySet=QuoteSet

# Connection timeouts (ms) for the SAP REST calls
sap.connectionTimeoutMs=120000
