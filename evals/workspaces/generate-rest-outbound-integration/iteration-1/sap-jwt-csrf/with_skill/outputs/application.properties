# ============================================================================
# post-quote-to-sap — SAP OData outbound (JWT + CSRF + cookies)
# ============================================================================

# --- SAP OData target endpoint ---------------------------------------------
# Full URL of the SAP OData EntitySet that receives the POST.
# Example: https://sap-apim.example.com/sap/opu/odata/sap/QUOTE_SERVICE/QuoteSet
ext.api.sap.serviceUrl=https://sap-apim.example.com/sap/opu/odata/sap/QUOTE_SERVICE/QuoteSet

# SAP environment tag used in the x-nova-sapsid header (PRD / UAT / DEV).
ext.api.sap.environment=PRD

# Convenience alias for the SKILL's generic header — used by rest-outbound-shared.
# Set by post-quote-to-sap.xml as setHeader serviceURL=ext.api.sap.serviceUrl.
ext.api.url=${ext.api.sap.serviceUrl}

# --- SAP API Management subscription ---------------------------------------
# Required when SAP API Management fronts the OData service.
# Stored encrypted — do NOT commit a raw key.
ext.api.subscriptionKey={ENC}encryptedSubscriptionKeyHere==

# --- OAuth 2.0 client-credentials (JWT) ------------------------------------
# Token endpoint exposed by SAP API Management or the upstream IdP.
ext.api.auth.url=https://sap-apim.example.com/oauth2/token
ext.api.auth.grantType=client_credentials
ext.api.auth.clientId=pricefx-quote-client
ext.api.auth.clientSecret={ENC}encryptedClientSecretHere==
ext.api.auth.scope=sap.quote.write

# --- Token cache refresh ---------------------------------------------------
# Set autoStartup=false in environments where SAP is unreachable (local dev).
# refreshPeriodMs should be safely less than the SAP token lifetime
# (default here: 30 minutes).
ext.api.tokens.autoStartup=true
ext.api.tokens.refreshPeriodMs=1800000

# --- Retry on transient errors ---------------------------------------------
ext.api.retry.maxRedeliveries=3
ext.api.retry.delayMs=5000

# --- Throttling ------------------------------------------------------------
ext.api.maxConcurrentConnections=10

# --- Dry-run toggle --------------------------------------------------------
# Set to 'true' in non-production to suppress the actual HTTP POST.
# rest-outbound-shared reads this from the call_is_DISABLED header.
ext.api.call_is_DISABLED=false
