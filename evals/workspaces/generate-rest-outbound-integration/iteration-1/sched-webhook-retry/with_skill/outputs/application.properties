# =========================================================================
# Outbound REST: export-pricelist-to-webhook
# Pushes Pricefx price-list updates to a downstream webhook on a daily cron.
# =========================================================================

# --- Target endpoint (no auth — webhook is unauthenticated; restrict via network/firewall) ---
ext.api.url=https://hooks.example.com/pricelist

# --- HTTP client timeouts (ms) ---
ext.api.connectTimeoutMs=30000
ext.api.socketTimeoutMs=60000

# --- Fetch batching ---
ext.api.batchSize=5000

# --- Retry on transient (5xx) errors: exponential backoff 5s, 10s, 20s ---
ext.api.retry.maxRedeliveries=3
ext.api.retry.delayMs=5000
ext.api.retry.backOffMultiplier=2
ext.api.retry.maxDelayMs=60000

# --- Dry-run toggle (set 'true' to suppress HTTP calls during testing) ---
ext.api.call_is_DISABLED=false

# --- Scheduling: daily at 02:00 UTC ---
ext.api.schedule.cron=0+0+2+?+*+*
ext.api.schedule.timezone=UTC
