# Integration identity (used as namespace for pfx-config keys)
integration.name=pricelist-webhook-export

# Route-specific properties
pfx\:export-pricelist-webhook.cron=0+0+6+*+*+?
pfx\:export-pricelist-webhook.webhookPath=/pricelist
pfx\:export-pricelist-webhook.connection=pricelist-webhook.connection

# Retry configuration (5xx errors)
pfx\:export-pricelist-webhook.maxRedeliveries=5
pfx\:export-pricelist-webhook.redeliveryDelayMs=5000
pfx\:export-pricelist-webhook.backoffMultiplier=2
pfx\:export-pricelist-webhook.maxRedeliveryDelayMs=60000
