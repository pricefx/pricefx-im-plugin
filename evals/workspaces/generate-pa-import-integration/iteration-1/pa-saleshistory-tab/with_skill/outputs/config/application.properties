# File handling properties — used by the file:// consumer URI in import-sales-history.xml

# Move processed files to a timestamped archive folder
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Read lock — wait until file size stabilizes before processing (no .done marker file is produced upstream)
read.lock=readLock=changed

# Optional: move failed files to an error folder (uncomment in route URI to enable: &{{error.file}})
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D
