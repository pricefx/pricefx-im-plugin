# =============================================================================
# Sales History (PA) import — route configuration
# =============================================================================

# Daily run at 02:00 UTC. Adjust to the customer's preferred quiet window.
pfx\:import-sales-history.cron=0+0+2+*+*+?

# -----------------------------------------------------------------------------
# Shared file-consumer properties (place once per project; reuse on every <from>)
# -----------------------------------------------------------------------------

# Move processed files to a timestamped archive folder under .archive/
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Wait until the upstream writer has stopped growing the file (no .done marker
# was specified for /sftp/transactions/, so we use readLock=changed).
read.lock=readLock=changed&readLockCheckInterval=5000&readLockMinAge=60000

# Move files that fail processing to .error/ for inspection
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D
