# =============================================================================
# Application properties — PA invoices import
# Merge these entries into the project's src/main/resources/repo/config/application.properties
# =============================================================================

# Shared file-consumer fragments (define once per project, reused by all routes)
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D
read.lock=readLock=changed
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D

# Route-specific schedule — daily at 03:00 local time
# Quartz cron format: seconds minutes hours day-of-month month day-of-week
# Spaces in the cron expression are encoded as '+' because the value is
# interpolated into a Camel URI attribute (file://...&scheduler.cron=...).
import-pa-invoices.cron=0+0+3+*+*+?
