# Route-specific properties for import-transactions
# Daily S3 transactions feed -> DMDS.TransactionFeed

# DMDS target
pfx\:import-transactions.targetDmds=DMDS.TransactionFeed

# Batch size for loaddataFile (as requested: 100k)
pfx\:import-transactions.batchSize=100000

# S3 source
pfx\:import-transactions.s3.bucket=pricefx-data
pfx\:import-transactions.s3.prefix=transactions/

# Daily schedule (Quartz cron) — 02:00 every day
pfx\:import-transactions.cron=0+0+2+*+*+?
