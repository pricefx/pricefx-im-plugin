# =========================================================================
#  import-sales-history route configuration
# =========================================================================

# Timezone used for the Quartz cron (2 AM in this zone).
integration.timezone=UTC

# Inbound directory where the upstream system drops YYYYMMDD.csv.
# Path was given in the requirements as /sftp/transactions/.
pfx\:import-sales-history.inboundPath=/sftp/transactions

# -------------------------------------------------------------------------
# Shared file-consumer building blocks (per docs/components.md conventions).
# -------------------------------------------------------------------------

# Archive processed file under .archive/<YYYY>/<MM>/<name>__<timestamp>.<ext>
archive.file=move=.archive/%24%7Bdate:now:yyyy%7D/%24%7Bdate:now:MM%7D/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd_HHmmss%7D.%24%7Bfile:ext%7D

# Wait for file size to stabilise (no .done marker available from upstream).
read.lock=readLock=changed

# Move failed files aside for inspection.
error.file=moveFailed=.error/%24%7Bfile:name.noext%7D__%24%7Bdate:now:yyyyMMdd-HHmmss%7D.%24%7Bfile:ext%7D
