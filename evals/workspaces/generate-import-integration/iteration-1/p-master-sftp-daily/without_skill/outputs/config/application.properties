# --- Route-specific properties ---

# Daily SFTP product import schedule: every day at 02:00
pfx\:import-products.cron=0 0 2 * * ?

# --- Default file-handling properties (recommended for any file consumer) ---

# Move processed files to a timestamped archive on the SFTP server
archive.file=move=.archive/$\{date:now:yyyy\}/$\{date:now:MM\}/$\{file:name.noext\}__$\{date:now:yyyyMMdd_HHmmss\}.$\{file:ext\}

# Wait until file size stabilizes before reading (no .done marker assumed)
read.lock=readLock=changed

# Move failed files to error folder
error.file=moveFailed=.error/$\{file:name.noext\}__$\{date:now:yyyyMMdd-HHmmss\}.$\{file:ext\}
