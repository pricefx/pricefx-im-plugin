# ----------------------------------------------------------------------------
# Seller Master REST Import — runtime configuration
# ----------------------------------------------------------------------------

# Route metadata
pfx\:import-sellers.description=Imports seller master from internal ERP REST API into Pricefx SL master every 4 hours.

# Optional: override the cron via property if you prefer not to hard-code it in the route.
# Default in the route XML is: 0 0 0/4 * * ?   (every 4 hours, starting at 00:00)
# pfx\:import-sellers.cron=0+0+0/4+*+*+?

# REST timeout (ms) used by pfx-rest in the route
pfx\:import-sellers.connectionTimeoutMs=500000
