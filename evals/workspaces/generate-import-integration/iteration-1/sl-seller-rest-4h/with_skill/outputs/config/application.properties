# ---------------------------------------------------------------
# Properties for import-sellers-from-rest
# ---------------------------------------------------------------
# No file-system, archive, or read-lock properties are needed for
# this REST-driven route — the trigger is a Quartz cron, not a file
# consumer. Properties listed here are only the ones referenced by
# this integration's connection/route.
#
# The Quartz cron is hard-coded in the route URI:
#   cron=0+0+0/4+*+*+?    -> every 4 hours, at minute 0 of each hour
#
# Pricefx connection credentials (URL/partition/user/password) are
# expected to come from the partition-level integration.pfx.*
# properties already provisioned in this environment.
